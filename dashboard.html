<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Smart Stadium Parking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Parking Records</h1>
        <a href="{{ url_for('download') }}" class="download-btn">Download CSV</a>
        
        <table>
            <thead>
                <tr>
                    <th>Full Name</th>
                    <th>Vehicle Type</th>
                    <th>Vehicle Number</th>
                    <th>Entry Direction</th>
                    <th>Exit Direction</th>
                </tr>
            </thead>
            <tbody>
                {% for record in parking_data %}
                <tr>
                    <td>{{ record['Full Name'] }}</td>
                    <td>{{ record['Vehicle Type'] }}</td>
                    <td>{{ record['Vehicle Number'] }}</td>
                    <td>{{ record['Entry Direction'] }}</td>
                    <td>{{ record['Exit Direction'] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
